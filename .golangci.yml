# golangci-lint v2 configuration for NewKins
# Docs: https://golangci-lint.run/docs/product/migration-guide

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # Check for unchecked errors
    - govet          # Reports suspicious constructs
    - ineffassign    # Detect unused assignments
    - staticcheck    # Static analysis checks
    - unused         # Find unused code
    - misspell       # Find commonly misspelled English words
    - bodyclose      # Check for HTTP response body close
    - noctx          # Find HTTP requests without context
    - prealloc       # Find slice declarations that could be preallocated
    - errorlint      # Check for error wrapping best practices (errors.Is, %w)
    - gosec          # Inspect source code for security problems
    - unparam        # Report unused function parameters

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      disable:
        - fieldalignment  # Too noisy for existing code
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: false

  exclusions:
    rules:
      # Exclude some linters from running on tests files
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose
      # Exclude known false positives
      - text: "SA1019"  # Deprecated usage - we have intentional deprecated constants
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
