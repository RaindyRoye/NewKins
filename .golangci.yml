# golangci-lint configuration for NewKins
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  go: "1.22"

linters:
  disable-all: true
  enable:
    - errcheck       # Check for unchecked errors
    - gosimple       # Simplify code
    - govet          # Reports suspicious constructs
    - ineffassign    # Detect unused assignments
    - staticcheck    # Static analysis checks
    - unused         # Find unused code
    - misspell       # Find commonly misspelled English words
    - gofmt          # Check formatting
    - bodyclose      # Check for HTTP response body close
    - noctx          # Find HTTP requests without context
    - prealloc       # Find slice declarations that could be preallocated

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
  govet:
    disable:
      - fieldalignment  # Too noisy for existing code
  misspell:
    locale: US
  prealloc:
    simple: true
    range-loops: true
    for-loops: false

issues:
  # Maximum issues count per linter per file (0 = unlimited)
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - errcheck
        - bodyclose
    # Exclude known false positives
    - text: "SA1019"  # Deprecated usage - we have intentional deprecated constants
      linters:
        - staticcheck
