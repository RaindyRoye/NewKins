# Gokins (NewKins) Configuration Example
# Copy this file to app.yml (or app.yaml) and edit for your environment.
# Location: <workdir>/app.yml (default workdir: ~/.gokins)

server:
  # External access URL for the web UI (used in webhook callbacks, emails, etc.)
  # Example: https://ci.example.com
  host: ""

  # JWT signing key for user authentication tokens.
  # Generate a secure random string: openssl rand -hex 32
  loginKey: ""

  # Maximum number of concurrent builds. Default: 5
  runLimit: 5

  # HyperByte Transfer Protocol listen address (for runner communication).
  # Leave empty to auto-detect.
  hbtpHost: ""

  # Secret used for runner authentication.
  # Generate a secure random string: openssl rand -hex 32
  secret: ""

  # Additional shell runner plugins to load.
  # Built-in: "shell@ssh", "gokins@git"
  # Add custom plugins as needed.
  shells: []

  # Token for downloading artifacts (optional).
  DownToken: ""

datasource:
  # Database driver: "sqlite", "mysql", or "postgres"
  driver: "sqlite"

  # Database connection string.
  #
  # SQLite (default, no setup required):
  #   url: "./gokins.db"
  #
  # MySQL:
  #   url: "root:password@tcp(localhost:3306)/gokins?charset=utf8mb4&parseTime=true"
  #
  # PostgreSQL:
  #   url: "postgres://user:password@localhost:5432/gokins?sslmode=disable"
  url: "./gokins.db"
